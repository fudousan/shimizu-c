    body { font-family: 'Helvetica Neue', sans-serif; margin: 0; background-color: #ffffff; color: #333; }

    nav { display: flex; justify-content: center; background-color: #f2f2f2; border-bottom: 2px solid #5c432d; padding: 0.5em 0; }
    nav a { padding: 0.8em 1.2em; margin: 0 0.3em; text-decoration: none; color: #5c432d; font-weight: bold; border: 2px solid #5c432d; border-radius: 8px; background-color: #fff; transition: all 0.3s ease; }
    nav a:hover { background-color: #5c432d; color: white; transform: translateY(-2px); }
    nav a.active { background-color: #5c432d; color: #fff; }

    h1 { background-color:#5c432d; color:white; padding:0.5em; font-size:1.5em; margin:0; }

    .gallery {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px;
      justify-items: center;
      padding: 2em;
    }

    @media (max-width: 1024px) {
      .gallery { grid-template-columns: repeat(2, 1fr); }
    }

    @media (max-width: 600px) {
      .gallery { grid-template-columns: 1fr; }
    }

    .item {
      background:white;
      padding:10px;
      border-radius:8px;
      width:100%;
      max-width:250px;
      box-shadow:0 0 8px rgba(0,0,0,0.1);
      text-align:center;
      cursor:pointer;
    }

    .item img {
      width:100%;
      height:auto;
      border-radius:5px;
      transition: transform 0.2s;
    }

    .item img:hover { transform: scale(1.05); }

    .caption { margin-top:10px; font-weight:bold; font-size:0.9em; }

    /* モーダル */
    .modal {
      display: none;
      position: fixed;
      z-index: 999;
      left: 0; top: 0;
      width: 100%; height: 100%;
      background-color: rgba(0,0,0,0.8);
      justify-content: center;
      align-items: center;
    }
    .modal img {
      max-width: 90%; max-height: 90%;
      border-radius: 8px;
      box-shadow: 0 0 20px rgba(0,0,0,0.5);
    }
    .modal:target { display: flex; }

    footer { background-color:#5c432d; color:white; text-align:center; padding:1em; font-size:0.9em; }
    footer a { color:#fff; text-decoration:underline; }
  </style>
